<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Class Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dexie.js CDN -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5',
                        primaryDark: '#4338ca',
                        secondary: '#10b981',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans antialiased h-screen overflow-hidden flex">

    <!-- Login Area -->
    <div id="login-screen" class="fixed inset-0 bg-gradient-to-br from-indigo-50 to-blue-100 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-white/40 glass-effect">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-graduation-cap text-4xl text-primary drop-shadow-sm"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">EduManage</h1>
                <p class="text-slate-500 text-sm mt-2 font-medium">Empowering Education, Seamlessly</p>
            </div>
            
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="login-email" required class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all font-medium text-slate-700" placeholder="admin@test.com">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="login-password" required class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all font-medium text-slate-700" placeholder="••••••••">
                    </div>
                </div>
                
                <div id="login-error" class="hidden bg-red-50 text-red-500 text-sm p-3 rounded-lg border border-red-100 flex items-center gap-2">
                    <i class="fas fa-exclamation-circle text-red-500"></i> Invalid email or password
                </div>
                
                <button type="submit" class="w-full bg-primary hover:bg-primaryDark text-white py-4 rounded-xl font-bold transition-all shadow-lg hover:shadow-primary/30 active:scale-[0.98]">
                    Sign In
                </button>
                
                <div class="mt-8 p-4 bg-indigo-50/50 rounded-xl border border-indigo-100 text-sm text-slate-600">
                    <p class="font-bold text-slate-800 mb-2"><i class="fas fa-info-circle text-primary mr-1"></i> Demo Credentials</p>
                    <ul class="space-y-1 ml-1 text-xs sm:text-sm font-medium">
                        <li><span class="inline-block w-16 text-slate-500">Admin:</span> admin@test.com / admin123</li>
                        <li><span class="inline-block w-16 text-slate-500">Teacher:</span> teacher@test.com / teacher123</li>
                        <li><span class="inline-block w-16 text-slate-500">Student:</span> student@test.com / student123</li>
                    </ul>
                </div>
            </form>
        </div>
    </div>

    <!-- Main App Area -->
    <div id="app-screen" class="hidden w-full h-full flex overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-72 bg-darkBg text-slate-300 flex flex-col transition-all duration-300 relative border-r border-slate-800/50 shadow-2xl">
            <!-- Sidebar Header -->
            <div class="p-6 flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-primary to-blue-500 flex items-center justify-center shadow-lg">
                    <i class="fas fa-graduation-cap text-white text-xl"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tight text-white drop-shadow-sm">EduManage</span>
            </div>
            
            <!-- User Profile Snippet (Sidebar) -->
            <div class="mx-4 mb-6 p-4 rounded-2xl bg-cardBg border border-slate-700/50 flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg shadow-md border-2 border-darkBg object-cover" id="user-avatar-sidebar">
                    A
                </div>
                <div class="overflow-hidden">
                    <p class="text-sm font-bold text-white truncate w-full" id="user-name-display">John Doe</p>
                    <span class="inline-flex items-center mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-primary/20 text-primary border border-primary/20" id="user-role-display">Admin</span>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 px-4 space-y-1.5 overflow-y-auto custom-scrollbar pb-6" id="nav-menu">
                <!-- Navigation inserted by JS -->
            </nav>

            <!-- Bottom Actions -->
            <div class="p-4 border-t border-slate-800">
                <button id="logout-btn" class="flex items-center gap-3 w-full px-4 py-3 text-slate-400 hover:text-white hover:bg-red-500/10 hover:border-red-500/20 rounded-xl transition-all font-medium border border-transparent mr-2 group">
                    <i class="fas fa-sign-out-alt group-hover:text-red-400 transition-colors"></i>
                    <span class="group-hover:text-red-400">Log out</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full bg-slate-50/50 relative">
            
            <!-- Topbar -->
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-8 py-5 flex justify-between items-center z-10 sticky top-0">
                <div>
                    <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight" id="page-title">Dashboard</h2>
                    <p class="text-sm text-slate-500 font-medium mt-0.5" id="page-subtitle">Welcome back, have a great day!</p>
                </div>
                <div class="flex items-center gap-5">
                    <button class="relative p-2 text-slate-400 hover:text-primary transition-colors hover:bg-slate-100 rounded-full">
                        <i class="fas fa-bell text-xl"></i>
                        <span class="absolute top-1 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
                    </button>
                    <div class="h-11 w-11 rounded-full bg-gradient-to-br from-primary to-indigo-600 flex items-center justify-center text-white font-bold shadow-md cursor-pointer border-2 border-white hover:scale-105 transition-transform">
                        <span id="user-initial">A</span>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content Container -->
            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar relative" id="content-area">
                <!-- Dynamic Content Goes Here -->
            </div>
            
            <!-- Dynamic Background decoration -->
            <div class="absolute top-0 right-0 -z-10 w-96 h-96 bg-primary/5 rounded-full blur-3xl mix-blend-multiply pointer-events-none"></div>
            <div class="absolute bottom-0 left-10 -z-10 w-72 h-72 bg-blue-500/5 rounded-full blur-3xl mix-blend-multiply pointer-events-none"></div>
        </main>
    </div>

    <!-- Script references -->
    <script src="app.js"></script>
</body>
</html>
